name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-typecheck-test:
    name: Lint, Type Check & Test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Run unit tests
        run: npm test
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://test.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_DEFAULT_KEY: test-anon-key
          SUPABASE_SERVICE_ROLE_KEY: test-service-role-key
          STRIPE_SECRET_KEY: sk_test_fake
          STRIPE_WEBHOOK_SECRET: whsec_test_fake
          RESEND_API_KEY: test-resend-key
          ANTHROPIC_API_KEY: test-anthropic-key
          DEFAULT_STUDIO_ID: aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee
          CRON_SECRET: test-cron-secret
          # ── Supabase test instance env vars (MED-27) ──
          # When a dedicated Supabase test project is provisioned, set these as
          # GitHub Actions secrets and uncomment the integration test step below.
          # SUPABASE_URL: ${{ secrets.SUPABASE_TEST_URL }}
          # SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_TEST_ANON_KEY }}
          # SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_TEST_SERVICE_ROLE_KEY }}

      # ── Integration tests (MED-27) ──────────────────────────────────
      # Requires a dedicated Supabase test project with seeded schema.
      # Uncomment and configure once the test instance is provisioned.
      #
      # - name: Run integration tests
      #   run: npm run test:integration
      #   env:
      #     SUPABASE_URL: ${{ secrets.SUPABASE_TEST_URL }}
      #     SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_TEST_ANON_KEY }}
      #     SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_TEST_SERVICE_ROLE_KEY }}
      #     STRIPE_SECRET_KEY: ${{ secrets.STRIPE_TEST_SECRET_KEY }}
      #     STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_TEST_WEBHOOK_SECRET }}
      #     DEFAULT_STUDIO_ID: ${{ secrets.TEST_STUDIO_ID }}

      - name: Audit dependencies
        run: npm audit --audit-level=high

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: lint-typecheck-test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: apps/web/.next/cache
          key: nextjs-cache-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('apps/web/src/**') }}
          restore-keys: |
            nextjs-cache-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}-
            nextjs-cache-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://test.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_DEFAULT_KEY: test-anon-key
