# Meridian — Netlify deployment configuration
# Turborepo monorepo: apps/web is the Next.js app

[build]
  base = "apps/web"
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Extended timeout for all serverless functions (Pro plan supports up to 60s)
[functions]
  node_bundler = "esbuild"
  external_node_modules = ["@supabase/supabase-js"]

# The Next.js server handler timeout (applies to all API routes)
[functions."___netlify-server-handler"]
  timeout = 60

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(self)"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://*.supabase.co https://js.stripe.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://*.supabase.co https://*.stripe.com; font-src 'self'; connect-src 'self' https://*.supabase.co https://api.stripe.com https://api.anthropic.com https://api.resend.com https://inn.gs; frame-src https://js.stripe.com; object-src 'none'; base-uri 'self'"

